<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><title>Legion userscript UI tests</title></head>
<body>
<ul class="cy-chat"><ol class="cy-chat-l">
  <li><b data-nick="faldoorch">faldoorch</b> <span>тест</span></li>
  <li data-nick="pupok309"><b data-nick="pupok309">pupok309</b> <span>привет @faldoorch</span></li>
</ol></ul>
<pre id="out"></pre>
<script>
  const mem = {};
  window.GM_getValue = (key, fallback) => (key in mem ? mem[key] : fallback);
  window.GM_setValue = (key, value) => { mem[key] = value; };
  window.GM_registerMenuCommand = () => {};
  window.__FDS_TEST__ = true;
  mem.fds_cfg_v1 = JSON.stringify({ shared: false });
</script>
<script src="../legion-guild.user.js"></script>
<script>
setTimeout(() => {
  const rows = [];
  const ok = (name, condition) => rows.push((condition ? 'OK   ' : 'FAIL ') + name);
  try {
    const model = window.FaldoorchShimmer;
    model.open();
    const shadow = document.getElementById('fds-host').shadowRoot;
    ok('loot window exists', !!shadow.getElementById('fdsLootWindow'));
    ok('owner hint is removed', !shadow.textContent.includes('Управление владельца') && !shadow.textContent.includes('Укажи ник faldoorch'));
    ok('menu uses legionnaire helmet SVG', !!shadow.querySelector('.bubble .bicon svg .helmet-crest'));
    const latestChat = document.querySelector('ol.cy-chat-l > li:last-child');
    ok('latest chat message remains intact', latestChat.textContent.includes('@faldoorch') && !latestChat.querySelector('[data-fds-mention]') && !latestChat.classList.contains('fds-name'));
    const chatList = document.querySelector('ol.cy-chat-l');
    model.cfg.nick = 'pupok309';
    const dynamicChat = document.createElement('li');
    dynamicChat.setAttribute('data-nick', 'pupok309');
    dynamicChat.innerHTML = '<b data-nick="pupok309">pupok309</b> <span>динамическое @faldoorch</span>';
    chatList.insertBefore(dynamicChat, chatList.firstElementChild);
    model.scan();
    ok('dynamic latest message remains visible', dynamicChat.isConnected && dynamicChat.textContent.includes('динамическое @faldoorch') && !dynamicChat.classList.contains('fds-name'));
    ok('dynamic latest sender keeps shimmer', dynamicChat.querySelector('b[data-nick="pupok309"]').classList.contains('fds-name'));
    model.loot.setState({
      round: { id: 'active', item_name: 'Тестовый меч', rarity: 'эпическая', status: 'active', ends_at: new Date(Date.now() + 120000).toISOString() },
      rolls: [{ id: 'r1', round_id: 'active', user_id: 'other', nick: 'pupok309', roll: 87 }],
      server_now: new Date().toISOString(),
    });
    model.loot.open();
    model.cfg.nick = 'pupok309';
    model.refresh();
    model.loot.open();
    ok('item and rarity render', shadow.getElementById('fdsLootBody').textContent.includes('Тестовый меч') && shadow.getElementById('fdsLootBody').textContent.includes('эпическая'));
    ok('latest sender keeps shimmer', latestChat.querySelector('b[data-nick="pupok309"]').classList.contains('fds-name'));
    ok('announcement stays in UI', shadow.getElementById('fdsLootNotice').textContent.includes('ВНИМАНИЕ ЛЕГИОН!'));
    ok('announcement is not duplicated', shadow.querySelectorAll('.loot-announcement').length === 1);
    ok('journal renders roll', shadow.querySelector('.loot-journal').textContent.includes('87'));
    model.loot.setState({
      round: { id: 'active', item_name: 'Тестовый меч', rarity: 'эпическая', status: 'active', ends_at: new Date(Date.now() + 120000).toISOString() },
      rolls: [
        { id: 'r2', round_id: 'active', user_id: 'other-2', nick: 'Другой игрок', roll: 99 },
        { id: 'r1', round_id: 'active', user_id: 'other', nick: 'pupok309', roll: 87 },
      ],
      server_now: new Date().toISOString(),
    });
    ok('new server roll appears for everyone', shadow.querySelector('.loot-journal').textContent.includes('Другой игрок') && shadow.querySelector('.loot-journal').textContent.includes('99'));
    ok('participant cannot see owner controls', shadow.getElementById('fdsLootOwner').hidden);
    model.cfg.nick = 'faldoorch';
    model.refresh();
    model.loot.open();
    ok('faldoorch sees owner controls', !shadow.getElementById('fdsLootOwner').hidden);
    model.loot.setState({
      round: { id: 'expired', item_name: 'Старый предмет', rarity: 'серая', status: 'active', ends_at: new Date(Date.now() - 1000).toISOString() },
      rolls: [], server_now: new Date().toISOString(),
    });
    ok('expired round disables roll', shadow.getElementById('fdsLootRoll').disabled);
    model.loot.setState({ round: null, rolls: [], server_now: new Date().toISOString() });
    ok('empty state renders', shadow.getElementById('fdsLootBody').textContent.includes('нет активного разролла'));
    model.loot.setState({
      round: { id: 'live-timer', item_name: 'Live timer', rarity: 'серая', status: 'active', ends_at: new Date(Date.now() + 5000).toISOString() },
      rolls: [], server_now: new Date().toISOString(),
    });
    model.loot.open();
    const timerBefore = shadow.querySelector('.loot-timer').textContent;
    setTimeout(() => {
      const timerAfter = shadow.querySelector('.loot-timer').textContent;
      ok('live timer ticks every second', model.loot.timerTicks() >= 2);
      model.loot.setState({
        round: { id: 'live-timer', item_name: 'Live timer', rarity: 'серая', status: 'active', ends_at: new Date(Date.now() - 1000).toISOString() },
        rolls: [], server_now: new Date().toISOString(),
      });
      setTimeout(() => {
        ok('live timer updates without state reload [' + shadow.querySelector('.loot-timer').textContent + ']', shadow.querySelector('.loot-timer').textContent === 'завершён');
        ok('live timer disables roll after expiry [' + shadow.getElementById('fdsLootRoll').disabled + ']', shadow.getElementById('fdsLootRoll').disabled);
        model.cfg.nick = 'pupok309';
        const observedChat = document.createElement('li');
        observedChat.setAttribute('data-nick', 'pupok309');
        observedChat.innerHTML = '<b data-nick="pupok309">pupok309</b> <span>сообщение через observer @faldoorch</span>';
        chatList.appendChild(observedChat);
        model.scan();
        const finishObserverCheck = () => {
          ok('observer message remains visible', observedChat.isConnected && observedChat.textContent.includes('сообщение через observer @faldoorch') && !observedChat.classList.contains('fds-name'));
          ok('observer sender keeps shimmer', observedChat.querySelector('b[data-nick="pupok309"]').classList.contains('fds-name'));
          document.getElementById('out').textContent = rows.join('\n') + '\n\nитог: ' + rows.filter((row) => row.startsWith('OK')).length + '/' + rows.length + ' OK';
        };
        const waitForObserver = (left) => {
          if (observedChat.querySelector('b[data-nick="pupok309"]').classList.contains('fds-name') || left <= 0) {
            finishObserverCheck();
            return;
          }
          setTimeout(() => waitForObserver(left - 50), 50);
        };
        waitForObserver(1000);
      }, 1200);
    }, 2200);
  } catch (error) {
    document.getElementById('out').textContent = 'ERROR: ' + error.message + '\n' + error.stack;
  }
}, 500);
</script>
</body>
</html>
